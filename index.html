<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Modell Demo</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica', sans-serif;
      background-color: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background-color: #000;
      padding: 2rem 1.5rem 1rem;
    }

    header img {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      height: auto;
    }

    a {
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      text-decoration: none;
      margin: 0.5rem 0;
    }

    a:hover {
      text-decoration: underline;
    }

    model-viewer {
      width: 100%;
      max-width: 500px;
      height: 500px;
      margin-top: 1rem;
    }

    .ar-button {
      margin-top: 1rem;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .ar-button img {
      width: 50px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .links {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <img src="assets/header.png" alt="Logo" />
  </header>

  <!-- 3D-Modell -->
  <model-viewer
    id="modelViewer"
    src="assets/flucc1_dezimiert.glb"
    ios-src="assets/flucc_blue4(1).usdz"
    alt="Ein 3D-Modell"
    ar
    ar-modes="scene-viewer quick-look webxr"
    camera-controls
    autoplay
    shadow-intensity="1"
    environment-image="neutral"
    camera-target="0m 0m 0m"
    camera-orbit="0deg 75deg auto"
  >
  </model-viewer>

  <!-- Funktionaler AR-Button -->
  <button class="ar-button" onclick="document.getElementById('modelViewer').activateAR()">
    <img src="assets/ar-sweep_pink.png" alt="AR starten" />
  </button>

  <!-- Beide Links unter dem AR-Button -->
  <div class="links">
   <!-- <a href="https://www.instagram.com/dein_dj_name" target="_blank">🎧 DJ INSTA</a> -->
    <a href="https://gesindeldernacht.at/#/tickets" target="_blank">🎟️ Tickets kaufen</a>
  </div>

</body>
</html>
